[build-system]
# PySide6 must match the Qt version used at compile time: the wheel's
# pyside6_qtcore_python.h includes Qt headers that only exist in the Qt the
# PySide6 release was built against (e.g. 6.9+ added qjsonparseerror.h, which
# Qt 6.8 lacks, so PySide6 6.9+ headers cannot compile against Qt 6.8).
# The CI installs Qt 6.8.3 via aqt, so the build env pins PySide6 6.8.3.
# Keep this pin in sync with the aqt Qt version in
# .github/workflows/publish-python-bindings.yml.
requires = [
    "scikit-build-core>=0.10",
    "PySide6==6.8.3.*",
    "shiboken6-generator==6.8.3.*",
]
build-backend = "scikit_build_core.build"

[project]
name = "PySideSARibbon"
version = "3.0.0"
description = "Python bindings for SARibbon - a Qt Ribbon UI framework (PySide6)"
license = "MIT"
requires-python = ">=3.10"
# libpyside6 carries a minor-versioned soname (libpyside6.abi3.so.6.8), so the
# compiled module only resolves against the matching PySide6 6.8 runtime.
dependencies = ["PySide6==6.8.3.*"]

[project.urls]
Homepage = "https://github.com/czyt1988/SARibbon"
Repository = "https://github.com/czyt1988/SARibbon"

[tool.scikit-build]
cmake.version = ">=3.22"
ninja.version = ">=1.10"
wheel.packages = ["PySideSARibbon"]
cmake.source-dir = "."

# NOTE: the install() rules in CMakeLists.txt do not declare a COMPONENT, so they
# land in the default "Unspecified" component. Filtering on "PySideSARibbon" here
# silently excluded the compiled module from the wheel.

# Build configuration
cmake.build-type = "Release"
