# Build system configuration
[build-system]
requires = ["sip >=6.0.2", "PyQt-builder >=1.6", "PyQt6>=6.2", "PyQt6-sip>=13.4"]
build-backend = "sipbuild.api"

# PEP 621 metadata
[project]
name = "PyQtSARibbon"
version = "3.0.0"
description = "Python bindings for SARibbon - a Qt Ribbon UI framework"
license = "MIT"
requires-python = ">=3.8"
dependencies = ["PyQt6 (>=6.2)"]

[tool.sip.project]
tag-prefix = "SARibbon"
dunder-init = true

[tool.sip.bindings.saribbon]
pep484-pyi = true
define-macros = ["SA_RIBBON_BAR_NO_EXPORT", "SARIBBON_USE_3RDPARTY_FRAMELESSHELPER=0", "NOMINMAX", "SA_COLOR_WIDGETS_NO_DLL"]
sip-file = "SARibbon.sip"
include-dirs = ["src/core", "src/widgets", "src/widgets/colorWidgets", "binding-include"]
qmake-QT = ["widgets"]
builder-settings = ["RESOURCES += ../../src/SARibbonBar/SARibbonResource.qrc"]
headers = [
    "src/core/SARibbonCoreGlobal.h",
    "src/core/SARibbonQt5Compat.hpp",
    "src/core/contract/SARibbonAbstractLayoutHost.h",
    "src/core/contract/SARibbonAbstractLayoutItem.h",
