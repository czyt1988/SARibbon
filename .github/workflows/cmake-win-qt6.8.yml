name: CMake-Windows-Qt6.8LTS

on: [pull_request,push]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  MSVC:
    name: windows-${{ matrix.win_version }}-Qt-${{ matrix.qt_version }}-shared-${{ matrix.shared }}
    runs-on: windows-${{ matrix.win_version }}
    strategy:
      fail-fast: false
      matrix:
        win_version: [latest]
        qt_version: [6.8.*]
        shared: [ON]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
            version: ${{ matrix.qt_version }}
            cache: 'false'
            cache-key-prefix: ${{ runner.os }}-Qt-Cache-${{ matrix.qt_version }}
            dir: ${{ github.workspace }}/Qt
            host: 'windows'
            arch: 'win64_msvc2022_64'

      - name: Core purity check
        run: python tools/check_core_purity.py src/core
      - name: Configure CMake
        run: cmake -DCMAKE_BUILD_TYPE="${{env.BUILD_TYPE}}" -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DSARIBBON_BUILD_EXAMPLES=OFF -DSARIBBON_BUILD_TESTS=ON -B "${{github.workspace}}/build"

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Test
        env:
          # The tests create a QApplication. Runners have no usable GUI session, and Qt
          # blocks on a modal error box when the platform plugin cannot be initialized,
          # so use the headless platform like the Linux jobs do.
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure --no-tests=error -C ${{env.BUILD_TYPE}}
        working-directory: ${{github.workspace}}/build