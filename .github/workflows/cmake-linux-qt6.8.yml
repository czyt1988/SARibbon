name: CMake-Linux-Qt6.8LTS

on: [pull_request,push]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-${{ matrix.ubuntu_version }}
    name: Ubuntu-${{ matrix.ubuntu_version }}-Qt-${{ matrix.qt_version }}-shared-${{ matrix.shared }}-widgets-${{ matrix.widgets }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu_version: [latest]
        qt_version: [6.8.*]
        shared: [ON]
        widgets: [ON, OFF]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
          version: ${{ matrix.qt_version }}
          cache: 'true'
          cache-key-prefix: ${{ runner.os }}-Qt-Cache-${{ matrix.qt_version }}
          dir: ${{ github.workspace }}/Qt

    - name: Install Linux dependencies
      run: |
        sudo apt install -y libgl1-mesa-dev libxcb1-dev libgtk-3-dev libxcb-cursor0

    - name: Core purity check
      run: python3 tools/check_core_purity.py src/core

    # widgets=OFF is the core-only combination: tests cannot link widgets,
    # so SARIBBON_BUILD_TESTS follows the widgets axis.
    - name: Configure CMake
      run: cmake -DCMAKE_BUILD_TYPE="${{env.BUILD_TYPE}}" -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DSARIBBON_BUILD_EXAMPLES=OFF -DSARIBBON_BUILD_WIDGETS=${{ matrix.widgets }} -DSARIBBON_BUILD_TESTS=${{ matrix.widgets }} -B "${{github.workspace}}/build"

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      if: matrix.widgets == 'ON'
      env:
        QT_QPA_PLATFORM: offscreen
      run: ctest --output-on-failure --no-tests=error -C ${{env.BUILD_TYPE}}
      working-directory: ${{github.workspace}}/build
