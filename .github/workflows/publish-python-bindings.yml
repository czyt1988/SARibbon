name: Publish Python Bindings

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # ==================================================================
  # PySide6 bindings — uses scikit-build-core (CMake backend)
  # ==================================================================
  build-pyside6:
    name: PySide6 ${{ matrix.os }} py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python build dependencies
        run: |
          pip install -U pip
          pip install build twine

      - name: Install PySide6 and shiboken6
        # Pinned to the Qt the CI installs (aqt 6.8.3): PySide6 headers only
        # compile against the Qt the release was built with (NOTES B38)
        run: pip install "PySide6==6.8.3.*" "shiboken6-generator==6.8.3.*"

      # --- Qt installation per platform ---
      # Distro Qt (6.4 on ubuntu-24.04) is too old for PySide6 6.8.3 headers,
      # so Linux uses the same aqt Qt 6.8.3 as Windows (NOTES B38).
      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pip install aqtinstall
          python -m aqt install-qt linux desktop 6.8.3 gcc_64 -O "${{ github.workspace }}/Qt"
          # shiboken6 needs a system libclang for clang's builtin headers (NOTES B38)
          sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxcb1-dev libclang-dev
          LLVM_INSTALL_DIR=$(ls -d /usr/lib/llvm-* | sort -V | tail -1)
          echo "LLVM_INSTALL_DIR=$LLVM_INSTALL_DIR" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=${{ github.workspace }}/Qt/6.8.3/gcc_64" >> $GITHUB_ENV

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt
          # brew Qt is keg-only, find_package(Qt6) needs its prefix
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> $GITHUB_ENV

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pip install aqtinstall
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O "${{ github.workspace }}/Qt"
          echo "${{ github.workspace }}/Qt/6.8.3/msvc2022_64/bin" >> $GITHUB_PATH
          echo "CMAKE_PREFIX_PATH=${{ github.workspace }}/Qt/6.8.3/msvc2022_64" >> $GITHUB_ENV

      - name: Set MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build wheel
        shell: bash
        run: |
          pip install -U pip build
          python -m build --wheel pyside6/

      - name: Check wheel
        run: twine check pyside6/dist/*.whl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyside6-wheel-${{ matrix.os }}-${{ matrix.python }}
          path: pyside6/dist/*.whl

  # ==================================================================
  # PyQt5 bindings — uses SIP/PyQt-builder
  # ==================================================================
  build-pyqt5:
    name: PyQt5 ${{ matrix.os }} py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        # macOS dropped: Qt 5.15.2 ships no arm64 binaries and GitHub's Intel
        # runners are retired (B32), so a pyqt5/macOS leg cannot build (B38)
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build binding include mirror
        run: python tools/sa_build_binding_include.py

      - name: Install build dependencies
        run: |
          pip install -U pip
          pip install build twine sip PyQt-builder PyQt5 PyQt5-sip

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qtbase5-dev qt5-qmake qtbase5-dev-tools libqt5svg5-dev

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        run: |
          pip install aqtinstall
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -O "${{ github.workspace }}/Qt"
          echo "${{ github.workspace }}/Qt/5.15.2/msvc2019_64/bin" >> $GITHUB_PATH

      - name: Set MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build wheel
        run: python -m build --wheel --no-isolation
        env:
          QT_QMAKE_PATH: ${{ runner.os == 'Windows' && format('{0}\\Qt\\5.15.2\\msvc2019_64\\bin\\qmake.exe', github.workspace) || '' }}

      - name: Check wheel
        run: twine check dist/*.whl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyqt5-wheel-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.whl

  # ==================================================================
  # PyQt6 bindings — uses SIP/PyQt-builder from pyqt6/ directory
  # ==================================================================
  build-pyqt6:
    name: PyQt6 ${{ matrix.os }} py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build binding include mirror
        run: python tools/sa_build_binding_include.py

      - name: Install build dependencies
        run: |
          pip install -U pip
          pip install build twine sip PyQt-builder PyQt6 PyQt6-sip

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-base-dev-tools qt6-svg-dev

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: brew install qt

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        run: |
          pip install aqtinstall
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O "${{ github.workspace }}/Qt"
          echo "${{ github.workspace }}/Qt/6.8.3/msvc2022_64/bin" >> $GITHUB_PATH

      - name: Set MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build wheel
        run: python -m build --wheel --no-isolation pyqt6/
        env:
          QT_QMAKE_PATH: ${{ runner.os == 'Windows' && format('{0}\\Qt\\6.8.3\\msvc2022_64\\bin\\qmake.exe', github.workspace) || '' }}

      - name: Check wheel
        run: twine check pyqt6/dist/*.whl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyqt6-wheel-${{ matrix.os }}-${{ matrix.python }}
          path: pyqt6/dist/*.whl

  # ==================================================================
  # Publish to PyPI
  # ==================================================================
  # ==================================================================
  # Dry-run: manual dispatch only, no PyPI upload (plan-03 S4-3).
  # Each track runs in its own venv - PyQt5/PyQt6/PySide6 runtime
  # libraries interfere when installed into the same environment.
  # ==================================================================
  dry-run:
    name: Dry-run ${{ matrix.track }} ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        track: [pyqt5, pyqt6, pyside6]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install -U pip build

      - name: Install Qt (Windows, qt5 track)
        if: runner.os == 'Windows' && matrix.track == 'pyqt5'
        shell: bash
        run: |
          pip install aqtinstall
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -O "${{ github.workspace }}/Qt"
          echo "${{ github.workspace }}/Qt/5.15.2/msvc2019_64/bin" >> $GITHUB_PATH

      - name: Install Qt (Windows, qt6/pyside6 tracks)
        if: runner.os == 'Windows' && matrix.track != 'pyqt5'
        shell: bash
        run: |
          pip install aqtinstall
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O "${{ github.workspace }}/Qt"
          echo "${{ github.workspace }}/Qt/6.8.3/msvc2022_64/bin" >> $GITHUB_PATH
      - name: Install Qt (Linux, qt5 track)
        if: runner.os == 'Linux' && matrix.track == 'pyqt5'
        run: sudo apt-get update && sudo apt-get install -y qtbase5-dev qt5-qmake qtbase5-dev-tools libqt5svg5-dev

      - name: Install Qt (Linux, qt6 track)
        if: runner.os == 'Linux' && matrix.track == 'pyqt6'
        run: |
          sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-base-dev-tools qt6-svg-dev
          # apt installs qmake6, the sip toolchain looks for plain qmake
          sudo ln -sf /usr/lib/qt6/bin/qmake6 /usr/local/bin/qmake

      # pyside6: PySide6 is pinned to 6.8.3 (see pyside6/pyproject.toml) and
      # must compile against the Qt it was built with — distro Qt (6.4 on
      # ubuntu-24.04) is too old, so install the matching aqt Qt like the
      # Windows leg (NOTES B38).
      - name: Install Qt (Linux, pyside6 track)
        if: runner.os == 'Linux' && matrix.track == 'pyside6'
        shell: bash
        run: |
          pip install aqtinstall
          python -m aqt install-qt linux desktop 6.8.3 gcc_64 -O "${{ github.workspace }}/Qt"
          # shiboken6 parses headers with libclang; the pip shiboken6_generator
          # wheel ships libclang but not clang's builtin headers (stddef.h),
          # so a system libclang is required (NOTES B38)
          sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxcb1-dev libclang-dev
          LLVM_INSTALL_DIR=$(ls -d /usr/lib/llvm-* | sort -V | tail -1)
          echo "LLVM_INSTALL_DIR=$LLVM_INSTALL_DIR" >> $GITHUB_ENV
      - name: Set MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build binding include mirror (sip tracks)
        if: matrix.track != 'pyside6'
        run: python tools/sa_build_binding_include.py

      - name: Install track build dependencies
        shell: bash
        run: |
          if [ "${{ matrix.track }}" = "pyqt6" ]; then pip install sip PyQt-builder PyQt6 PyQt6-sip; fi
          if [ "${{ matrix.track }}" = "pyqt5" ]; then pip install sip PyQt-builder PyQt5 PyQt5-sip; fi
          if [ "${{ matrix.track }}" = "pyside6" ]; then pip install "shiboken6-generator==6.8.3.*" "PySide6==6.8.3.*"; fi

      - name: Build wheel
        shell: bash
        env:
          CMAKE_PREFIX_PATH: ${{ runner.os == 'Windows' && format('{0}/Qt/6.8.3/msvc2022_64', github.workspace) || (runner.os == 'Linux' && matrix.track == 'pyside6' && format('{0}/Qt/6.8.3/gcc_64', github.workspace)) || '/usr/lib/qt6' }}
        run: |
          # Git Bash ships /usr/bin/link (coreutils) which shadows MSVC link.exe
          # inside nmake-driven builds; put the MSVC tools first (NOTES B36).
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$VCToolsInstallDir" ]; then
            export PATH="$(cygpath -u "$VCToolsInstallDir")bin/Hostx64/x64:$PATH"
          fi
          if [ "${{ matrix.track }}" = "pyside6" ]; then python -m build --wheel pyside6/; fi
          if [ "${{ matrix.track }}" = "pyqt6" ]; then python -m build --wheel --no-isolation pyqt6/; fi
          if [ "${{ matrix.track }}" = "pyqt5" ]; then python -m build --wheel --no-isolation; fi

      - name: Install wheel and smoke test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m venv /tmp/smoke-venv
          source /tmp/smoke-venv/Scripts/activate 2>/dev/null || source /tmp/smoke-venv/bin/activate
          if [ "${{ matrix.track }}" = "pyqt5" ]; then
            pip install dist/*.whl PyQt5 PyQt5-sip
            python -c "import PyQt5.QtWidgets; from PyQtSARibbon import saribbon; print('PyQtSARibbon OK')"
          fi
          if [ "${{ matrix.track }}" = "pyqt6" ]; then
            pip install pyqt6/dist/*.whl PyQt6 PyQt6-sip
            python -c "import PyQt6.QtWidgets; from PyQt6SARibbon import saribbon; print('PyQt6SARibbon OK')"
          fi
          if [ "${{ matrix.track }}" = "pyside6" ]; then
            pip install pyside6/dist/*.whl "PySide6==6.8.3.*"
            python -c "from PySideSARibbon import saribbon; print('PySideSARibbon OK')"
          fi

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: dryrun-${{ matrix.track }}-${{ matrix.os }}
          path: |
            dist/*.whl
            pyside6/dist/*.whl
            pyqt6/dist/*.whl

  publish:
    name: Publish to PyPI
    needs: [build-pyside6, build-pyqt5, build-pyqt6]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Trusted publishing (OIDC)
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List wheels
        run: ls -la dist/*.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses trusted publishing (OIDC) — no API token needed.
        # Configure trusted publishers at https://pypi.org/manage/account/publishing/
